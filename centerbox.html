       .box{
    display: flex;
    flex-wrap: wrap;          
    justify-content: center;  
    align-content: center;    
    gap: 10px;
    width: 220px;             
    height: calc(100vh - 206px);
    margin: auto;
}

.box1{

    height: 100px;
    border: 2px solid black;
    display: flex;
    justify-content: center;
    align-items: center;
}</style>
