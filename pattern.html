<html>
    <head>
        <title>Ankit ka hai  </title>
        <style>
            *{
                margin:0;
                padding:0;
                box-sizing:border-box;
            }
            body{
                background:blue;
                display:flex;
                justify-content:center;
                align-items:flex-start;
                height:100vh;
                padding-top:30px;
            }
            .container{
                width:320px;
                height:600px;
                background:blue;
                border-radius:8px;
            }
            .top-box{
                height:120px;
                background:#fff;
                display:flex;
                justify-content:center;
                align-items:center;
            }
            .circle{
                width: 100px;
                height:100px;
                border:2px solid #999;
                border-radius:50%;
            }
            .circle:nth-child(2),
            .circle:nth-child(3){
                margin-left:-36px;
            }
        </style>
        
    </head>
    <body>
        <div class="container">
            <div class="top-box">
                <div class="circle"></div>
                <div class="circle"></div>
                <div class="circle"></div>
            </div>
        </div>
    </body>
</html>
